<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ví dụ HTML ảnh và văn bản</title>
</head>
<body>

    <!-- Tiêu đề chính của trang -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- Đoạn văn bản mô tả -->
    <p>Đây là 2 thanh niên ngáo đá ở tỉnh cà mau.</p>

    <!-- Khối chứa hình ảnh và chú thích -->
    <figure>
        <img src="https://files.catbox.moe/ymaz1d.jpeg" alt="Ảnh mô tả ví dụ" width="600" height="300">
        <figcaption>Hình 1: Chú thích cho hình ảnh minh họa.</figcaption>
    </figure>

    <!-- Thêm đoạn văn bản khác -->
    <p>Bạn có thể thay đổi đường dẫn ảnh trong thuộc tính <code>src</code> thành link ảnh hoặc tên file ảnh thực tế của bạn.</p>

</body>
</html>
